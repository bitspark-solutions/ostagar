name: garments-dev

# Dev topology only. The legacy repository had ONE compose file that mixed the application with
# MailHog, pgAdmin and Redis-Commander and called it production; docs claimed a separate
# docker-compose.dev.yml that did not exist. Prod lives in compose.prod.yml (P8), and nothing in
# this file may appear there.
#
# HOST PORTS ARE NOT THE DEFAULTS, AND NOT ARBITRARILY. On this machine the obvious choices are
# unavailable, verified by real binds rather than by reading an exclusion list:
#   5432-5435  reserved by Windows/Hyper-V -> EACCES, so Postgres cannot publish the default port
#   6379       already published by another project's Dragonfly container
#   3000       already published by another project's UI
#   5199       reserved (this is what made the API look broken when it was only unbindable)
# Bind-tested free: 6432, 6380, 8080, 3100, 7123.

services:
  postgres:
    image: postgres:17-alpine
    container_name: garments-pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: garments
      # Deterministic byte collation for identifiers and codes. Bangla ordering is deliberately not
      # left to the server default: it is declared per column as COLLATE "bn-x-icu", so a factory
      # owner searching account names in Bangla gets Bangla ordering on every deployment.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports: ['6432:5432']
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d garments']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: garments-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot deploy step: applies pending migrations and exits. The API waits for it, because a
  # schema change belongs to the deploy, not to whichever web replica came up first.
  migrate:
    build:
      context: ..
      dockerfile: src/Cli/Dockerfile
    image: garments-cli:dev
    container_name: garments-migrate
    environment:
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=garments;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
    command: ['db', 'migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: src/Api/Dockerfile
    image: garments-api:dev
    container_name: garments-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: 'http://+:8080'
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=garments;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
      GarmentsAuth__SigningKey: ${GarmentsAuth__SigningKey:?set GarmentsAuth__SigningKey in .env}
      GarmentsAuth__Issuer: ${GarmentsAuth__Issuer:-garments-erp}
      GarmentsAuth__Audience: ${GarmentsAuth__Audience:-garments-web}
    # High-range port per the standing port-allocation rule: anything under ~30000 eventually
    # collides with another project on this machine or a Hyper-V exclusion range.
    ports: ['${GARMENTS_API_PORT:-41983}:8080']
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../web
      # Browser-side origin, not the internal service name: the request leaves the user's browser.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:41983}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-bn}
    image: garments-web:dev
    container_name: garments-web
    # High-range port per the standing port-allocation rule — 3100 fell inside a Windows
    # exclusion range (3022-3121 on this machine), the same failure that took 5432 and 5199.
    ports: ['${GARMENTS_WEB_PORT:-42107}:3000']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
